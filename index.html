<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <button class="theme-btn btn-dark w-10 mt-2"
            onclick="toggleTheme()">
             ☀︎ 
        </button>
        

    <h1 class="display-3 text-center">Weather Application</h1>
     <div class="container",>

        <div class="container d-flex justify-content-center">
    <div class="card shadow-sm text-center mt-3" style="width: 60%;">
        <div class="card-body">
            <h4 id="dateTime"></h4>
        </div>
    </div>
</div>
<div class="container w-50 mt-5">
        <div class="row">
            <div class="col ">
                <div class="form-floating">
                    <input type="text" class="form-control" id="cityInput" placeholder="Password">
                    <label for="cityInput">Enter your City</label>
                </div>
                <button class="btn btn-primary w-100 mt-2" id="btnSubmit" onclick="getData()">Show Weather</button>
            </div>
        </div>
        <div class="container w-75">
            <div id="result"></div>
        </div>
    </div>
    <div><center><button class="btn btn-info w-30 mt-2"
            onclick="downloadReport()">
             Download Report
        </button></center></div>


    <script src="./script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
